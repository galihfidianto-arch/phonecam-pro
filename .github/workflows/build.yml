name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             PhoneCamPro-unsigned.apk || \
          mv app/build/outputs/apk/release/app-release.apk PhoneCamPro-unsigned.apk

      # Debug APK adalah build yang bisa langsung di-install tanpa signing manual
      - name: Build debug APK (installable langsung)
        run: ./gradlew assembleDebug

      - name: Upload debug APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCamPro-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCamPro-release-unsigned
          path: PhoneCamPro-unsigned.apk
